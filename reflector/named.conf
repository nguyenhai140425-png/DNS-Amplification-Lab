options {
    directory "/var/cache/bind";

    listen-on port 53 {
        172.20.0.20;
    };

    listen-on-v6 {
        none;
    };

    recursion no;

    allow-recursion {
        none;
    };

    allow-query {
        172.20.0.0/24;
    };

    allow-transfer {
        none;
    };

    minimal-responses no;

    max-udp-size 1232;
};

zone "lab.test" {
    type master;
    file "/etc/bind/db.lab.test";

    allow-query {
        172.20.0.0/24;
    };
};
